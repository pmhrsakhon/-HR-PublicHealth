<title>ระบบบริหารงานบุคคล กองสาธารณสุข อบจ.สกลนคร</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#E9F1F7;--b1:rgba(45,212,191,.42);--b2:rgba(99,102,241,.30);--b3:rgba(251,191,36,.40);--glass:rgba(255,255,255,.86);--gb:rgba(255,255,255,.96);--line:rgba(11,60,93,.2);--tx:#0A1F2C;--mut:#38535F;--ac:#0A6C7A;--acs:rgba(10,108,122,.12);--amber:#F2A900;--bad:#B3261E;--panel:#fff;--btn:linear-gradient(135deg,#0A6C7A,#0B4E73);--btx:#fff;--th:#0B3C5D;--side:linear-gradient(170deg,#0B2D45,#0A5163);--hero:linear-gradient(120deg,#0B3C5D,#0A6C7A 60%,#3358C4);--sh:0 10px 32px rgba(10,40,70,.16);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{color-scheme:dark;--bg:#06131D;--b1:rgba(20,184,166,.30);--b2:rgba(79,70,229,.38);--b3:rgba(245,158,11,.14);--glass:rgba(255,255,255,.08);--gb:rgba(255,255,255,.18);--line:rgba(255,255,255,.22);--tx:#F2FAF8;--mut:#B9D0D5;--ac:#5EEAD4;--acs:rgba(94,234,212,.15);--amber:#FFC24B;--bad:#FF9A8B;--panel:#0F2838;--btn:linear-gradient(135deg,#5EEAD4,#38BDF8);--btx:#032029;--th:#14425A;--side:linear-gradient(170deg,rgba(255,255,255,.12),rgba(255,255,255,.05));--hero:linear-gradient(120deg,#0F4C6B,#0B7A86 60%,#4363D8);--sh:0 10px 32px rgba(0,0,0,.45)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;font-family:'IBM Plex Sans Thai',system-ui,sans-serif;color:var(--tx);background:var(--bg);line-height:1.65;font-size:16px}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(620px 420px at 6% 8%,var(--b1),transparent 70%),radial-gradient(720px 520px at 96% 12%,var(--b2),transparent 70%),radial-gradient(640px 520px at 55% 102%,var(--b3),transparent 70%)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.app{display:grid;grid-template-columns:268px 1fr;gap:18px;padding:18px;max-width:1440px;margin:0 auto}
.glass{background:var(--glass);border:1px solid var(--gb);border-radius:20px;box-shadow:var(--sh);-webkit-backdrop-filter:blur(16px) saturate(150%);backdrop-filter:blur(16px) saturate(150%)}
aside.glass{overflow-y:auto;padding:18px 14px;position:sticky;top:18px;height:calc(100vh - 36px);display:flex;flex-direction:column;gap:8px;background:var(--side);border-color:rgba(255,255,255,.16);color:#fff}
.brand{display:flex;flex-direction:column;text-align:center;gap:12px;align-items:center;font-weight:700;font-size:1.02rem;line-height:1.35;padding:4px 6px 14px;border-bottom:1px solid rgba(255,255,255,.18);margin-bottom:6px}
.brand small{display:block;font-weight:500;color:#C3DDE6;font-size:.8rem}
.logo-img{flex:none;width:118px;height:118px;border-radius:50%;object-fit:cover;background:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.22),0 0 26px rgba(120,200,255,.45),0 10px 26px rgba(0,0,0,.35)}
.logo{flex:none;width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#FFD26B,#F2A900);color:#1A1200;display:grid;place-items:center;font-size:1.3rem;box-shadow:0 4px 12px rgba(0,0,0,.28)}
#mbtn,#scrim,#mclose,#mtools{display:none}
#mclose{width:100%;margin-top:4px;background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:14px;padding:10px;font-weight:600}
nav{display:flex;flex-direction:column;gap:4px}
nav button{display:flex;gap:12px;align-items:center;text-align:left;background:none;border:0;padding:7px 10px;border-radius:14px;font-size:.93rem;font-weight:500;color:#E9F5F8}
nav button:hover{background:rgba(255,255,255,.12)}
nav button[aria-current="page"]{background:var(--amber);color:#1A1200;font-weight:700}
nav button.sub{margin-left:22px;padding:5px 10px;font-size:.88rem;border-left:2px solid rgba(255,255,255,.22);border-radius:0 14px 14px 0}
nav button.sub .i{width:28px;height:28px;font-size:.95rem}
nav button.sub:not([aria-current="page"]){color:#FFE08A;font-weight:700;border-left-color:#FFD26B;text-shadow:0 0 10px rgba(255,210,107,.35)}
nav button.sub:not([aria-current="page"]) .i{background:rgba(255,210,107,.22)}
nav button.sub:not([aria-current="page"]):hover{background:rgba(255,210,107,.16);color:#FFF1C2}
nav .chev{margin-left:auto;font-size:.8rem;opacity:.75}
nav .i{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.14);font-size:1.05rem;flex:none}
nav button[aria-current="page"] .i{background:rgba(26,18,0,.14)}
.side-foot{margin-top:auto;font-size:.78rem;color:#C3DDE6;padding:6px}
#view{display:flex;flex-direction:column;gap:18px}
main{min-width:0;display:flex;flex-direction:column;gap:18px}
.top{display:flex;gap:10px;align-items:center;padding:10px 14px;flex-wrap:wrap}
.search{flex:1;min-width:160px;text-align:left;background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:9px 14px;color:var(--mut);font-weight:500}
kbd{border:1px solid var(--line);border-radius:6px;padding:0 7px;font-size:.78rem;background:var(--acs);color:var(--tx)}
.top select,.icon{background:var(--panel);color:var(--tx);border:1.5px solid var(--line);border-radius:14px;padding:9px 12px;font-weight:500}
h1{margin:0;font-size:1.85rem;line-height:1.3;font-weight:700;letter-spacing:-.01em}
h2{margin:0 0 12px;font-size:1.15rem;font-weight:700}
.sub{color:var(--mut);margin:4px 0 0;font-size:.95rem;font-weight:500}
.glass.hero{background:var(--hero);border-color:rgba(255,255,255,.3);color:#fff;position:relative;overflow:hidden;padding:26px 28px}
.hero::after{content:"";position:absolute;right:-60px;top:-80px;width:290px;height:290px;border-radius:50%;background:radial-gradient(circle,rgba(255,210,107,.6),transparent 65%)}
.hero::before{content:"";position:absolute;right:130px;bottom:-120px;width:240px;height:240px;border-radius:50%;border:2px solid rgba(255,255,255,.22);box-shadow:0 0 0 28px rgba(255,255,255,.05)}
.hero>*{position:relative;z-index:1}
.hero h1{color:#fff}
.hero .sub{color:#E6F4F8;margin:6px 0 0}
.hchips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.hchips span{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.34);border-radius:99px;padding:3px 14px;font-size:.88rem;font-weight:600;color:#fff}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.kpi{padding:18px 18px 16px 24px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--k,var(--ac))}
.kpi:nth-child(1){--k:#0A8F9E}.kpi:nth-child(2){--k:#4A63D8}.kpi:nth-child(3){--k:#F2A900}.kpi:nth-child(4){--k:#E0584A}
.kpi b{display:block;font-size:2.3rem;line-height:1.15;font-weight:700;color:var(--tx)}
.kpi span{color:var(--mut);font-size:.93rem;font-weight:500}
.cols{display:grid;grid-template-columns:3fr 2fr;gap:18px}
.card{padding:20px}
.bar{display:grid;grid-template-columns:170px 1fr 56px;gap:12px;align-items:center;margin:10px 0;font-size:.92rem;font-weight:500}
.bar b{text-align:right}
.track{height:14px;border-radius:99px;background:rgba(110,140,160,.24);overflow:hidden}
.fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#0A8F9E,#4A63D8)}
.insight{border-left:6px solid var(--amber);padding:10px 14px;margin:10px 0;background:var(--acs);border-radius:0 14px 14px 0;font-size:.95rem;color:var(--tx)}
.insight.bad{border-color:var(--bad)}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px}
.btn{background:var(--btn);color:var(--btx);border:0;border-radius:14px;padding:11px 22px;font-weight:700;box-shadow:0 6px 16px rgba(10,80,110,.28)}
.btn:hover{filter:brightness(1.1)}
.btn.sec{background:var(--panel);color:var(--tx);border:1.5px solid var(--line);box-shadow:none}
.btn.sm{padding:3px 12px;font-size:.8rem}
.note{font-size:.85rem;color:var(--mut);font-weight:500}
.empty{padding:40px 20px;text-align:center;color:var(--mut);font-weight:500}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;margin-top:4px}
.form label{display:flex;flex-direction:column;gap:6px;font-size:.93rem;font-weight:600;color:var(--tx)}
.form input[type=text],.form select{padding:11px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--panel);color:var(--tx);font-weight:500}
.form input[type=text]:focus,.form select:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--acs);outline:0}
.form input[type=text],.form select{height:48px}
.form select:disabled{opacity:.6}
.form fieldset{grid-column:1/-1;border:0;padding:0;margin:0;display:grid;gap:10px}
.form legend{font-weight:700;padding:0;margin-bottom:8px;font-size:1rem}
.form label.opt{flex-direction:row;align-items:center;gap:14px;padding:14px 16px;border-radius:16px;border:2px solid var(--line);background:var(--panel);cursor:pointer;font-weight:600;font-size:1rem}
.opt:hover{border-color:var(--ac)}
.opt:has(input:checked){border-color:var(--ac);background:var(--acs);box-shadow:0 0 0 3px var(--acs)}
.opt input{width:24px;height:24px;accent-color:var(--ac);flex:none;margin:0}
.full{grid-column:1/-1}
.err{color:var(--bad);font-size:.92rem;font-weight:600}
.tw{overflow-x:auto;max-height:440px;overflow-y:auto;border-radius:14px;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:var(--th);color:#fff;font-weight:600;z-index:1}
td.n{text-align:right;font-weight:600}
tbody tr:nth-child(even){background:rgba(110,150,170,.1)}
tbody tr:hover{background:var(--acs)}
tr.tot td{font-weight:700;background:rgba(242,169,0,.3)}
option{background:var(--panel);color:var(--tx)}
dialog{border:0;background:transparent;padding:0;max-width:560px;width:calc(100% - 24px);margin-top:12vh;color:var(--tx)}
dialog::backdrop{background:rgba(5,20,30,.55);backdrop-filter:blur(4px)}
.pal.glass,#botbox.glass{background:var(--panel);border:1px solid var(--line)}
.pal{padding:14px}
.pal input,#botbox input{width:100%;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--panel);color:var(--tx)}

const KEY='hr2570_survey_v1';
/* แก้ไข: เก็บข้อมูลแบบสำรวจใน Firebase Realtime Database (path survey2570) ทุกคนเห็นข้อมูลชุดเดียวกันแบบเรียลไทม์
   ถ้าเชื่อม Firebase ไม่ได้ จะสำรองไว้ใน localStorage ของเครื่อง */
const SPATH='survey2570';
const lsGet=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}};
let DATA=db?[]:lsGet();
const lsSave=()=>{try{localStorage.setItem(KEY,JSON.stringify(DATA))}catch(e){}};
const fbErr=e=>(e&&e.code==='PERMISSION_DENIED')?'ไม่มีสิทธิ์เขียนฐานข้อมูล (ตรวจสอบ Rules ของ Firebase Realtime Database)':'บันทึกลงฐานข้อมูลไม่สำเร็จ: '+((e&&e.message)||e);
async function dbSet(rec){if(!db){const i=DATA.findIndex(d=>d.id===rec.id);if(i>=0)DATA[i]=rec;else DATA.push(rec);lsSave();return}await db.ref(SPATH+'/'+rec.id).set(rec)}
async function dbDel(id){if(!db){DATA=DATA.filter(d=>d.id!==id);lsSave();return}await db.ref(SPATH+'/'+id).remove()}
async function dbClear(){if(!db){DATA=[];lsSave();return}await db.ref(SPATH).remove()}
async function dbMerge(list){if(!db){lsSave();return}const m={};list.forEach(r=>m[r.id]=r);await db.ref(SPATH).update(m)}
if(db){
 db.ref(SPATH).on('value',snap=>{
  const v=snap.val()||{};DATA=Object.values(v).filter(Boolean);
  /* ย้ายข้อมูลเก่าที่ค้างใน localStorage ของเครื่องนี้ขึ้นฐานข้อมูลกลาง (ครั้งเดียว ไม่ทับข้อมูลที่มีอยู่) */
  try{const old=lsGet().filter(r=>r&&r.id&&!v[r.id]);if(old.length&&!localStorage.getItem(KEY+'_migrated')){
   localStorage.setItem(KEY+'_migrated','1');dbMerge(old).catch(e=>{localStorage.removeItem(KEY+'_migrated');console.warn(fbErr(e))})}}catch(e){}
  /* ไม่ re-render ขณะกำลังกรอกฟอร์ม เพื่อไม่ให้ข้อมูลที่พิมพ์หาย */

function bindSurvey(){
 const f=$('#f');if(!f){st.edit=null;return}
 const g=k=>f.elements[k].value.trim();
 const setUnits=a=>{const u=f.elements.unit,list=(U.find(x=>x[0]===a)||[,[]])[1];u.disabled=!a;u.innerHTML=a?'<option value="">เลือก รพ.สต.</option>'+op(list)+'<option value="__x">อื่น ๆ (ไม่อยู่ในรายการ)</option>':'<option value="">เลือกอำเภอก่อน</option>';f.elements.unitx.hidden=true};
 const unitName=()=>g('unit')==='__x'?g('unitx'):g('unit');
 /* คนเดิม = รพ.สต.เดียวกัน และเลขที่ตำแหน่งหรือชื่อ-สกุลตรงกัน */
 const find=()=>{const u=unitName(),p=g('posno'),n=g('name');if(!u)return null;return DATA.find(d=>d.id!==st.edit&&d.unit===u&&((p&&d.posno===p)||(n&&d.name===n)))};
 const goEdit=d=>{st.edit=d.id;st.msg='พบข้อมูลเดิมของ '+d.name+' ระบบดึงข้อมูลเดิมมาให้แล้ว กรุณาตรวจสอบและแก้ไข แล้วกด "บันทึกการแก้ไข"';render();scrollTo(0,0)};
 const chk=()=>{const d=find();if(d)goEdit(d)};
 f.elements.amphoe.onchange=()=>setUnits(f.elements.amphoe.value);
 f.elements.unit.onchange=()=>{const x=f.elements.unitx;x.hidden=f.elements.unit.value!=='__x';if(!x.hidden)x.focus();else chk()};
 f.elements.posno.onchange=chk;f.elements.name.onchange=chk;f.elements.unitx.onchange=chk;
 f.onsubmit=e=>{
  e.preventDefault();if(!canEdit())return;if(!intake()){$('#err').textContent='ขณะนี้ปิดรับข้อมูลแล้ว';return}
  const courses=[...f.querySelectorAll('input[name=c]:checked')].map(x=>x.value);
  const miss=[['unitN','ชื่อ รพ.สต.'],['amphoe','อำเภอ'],['name','ชื่อ-สกุล'],['posno','เลขที่ตำแหน่ง'],['pos','ตำแหน่ง'],['level','ระดับ'],['grp','กลุ่มงาน']].filter(x=>x[0]==='unitN'?!unitName():!g(x[0])).map(x=>x[1]);
  const err=$('#err');
  if(miss.length){err.textContent='กรุณากรอก: '+miss.join(', ');return}
  if(!courses.length){err.textContent='กรุณาเลือกอย่างน้อย 1 หลักสูตร';return}
  const dup=find();
  if(dup&&!st.edit){goEdit(dup);return}
  if(dup){err.textContent='มีข้อมูลของ '+dup.name+' อยู่แล้ว กรุณาตรวจสอบเลขที่ตำแหน่งหรือชื่อ-สกุล';return}
  const rec={id:st.edit||Date.now()+Math.random().toString(36).slice(2,6),unit:unitName(),amphoe:g('amphoe'),name:g('name'),posno:g('posno'),pos:g('pos'),level:g('level'),grp:g('grp'),courses,at:((DATA.find(d=>d.id===st.edit)||{}).at)||new Date().toISOString()};
  const was=!!st.edit,btn=f.querySelector('button[type=submit]');
  if(btn){btn.disabled=true;btn.textContent='กำลังบันทึก...'}
  err.textContent='';
  dbSet(rec).then(()=>{
   if(db){const i=DATA.findIndex(d=>d.id===rec.id);if(i>=0)DATA[i]=rec;else DATA.push(rec)}
   st.edit=null;if(!was)tpage=1;st.msg=(was?'แก้ไขข้อมูลของ ':'บันทึกแบบสำรวจของ ')+rec.name+' เรียบร้อยแล้ว';render();scrollTo(0,0);
  }).catch(e=>{err.textContent=fbErr(e);if(btn){btn.disabled=false;btn.textContent=was?'บันทึกการแก้ไข':'ส่งแบบสำรวจ'}});
 };
 /* โหมดแก้ไข: ใส่ข้อมูลเดิมลงฟอร์ม */
 const cur=st.edit&&DATA.find(d=>d.id===st.edit);
 if(cur){
  f.elements.amphoe.value=cur.amphoe;setUnits(cur.amphoe);
  if((U.find(x=>x[0]===cur.amphoe)||[,[]])[1].includes(cur.unit))f.elements.unit.value=cur.unit;
  else{f.elements.unit.value='__x';f.elements.unitx.hidden=false;f.elements.unitx.value=cur.unit}
  ['name','posno','pos','level','grp'].forEach(k=>f.elements[k].value=cur[k]||'');
  f.querySelectorAll('input[name=c]').forEach(x=>x.checked=cur.courses.includes(x.value));
 }else st.edit=null;
}

 else if(a==='xlsx')xlsx();
 else if(a==='demo')demo();
 else if(a==='pg'){tpage=+b.dataset.i||1;const el=$('#dinner');if(el)el.innerHTML=dataInner()}
 else if(a==='dtx'){if(canSee())dtXlsx()}
 else if(a==='tclr'){tq='';tpage=1;const i=$('#tq');if(i)i.value='';const el=$('#dinner');if(el)el.innerHTML=dataInner()}
 else if(a==='cancel'){st.edit=null;st.msg='';render()}
 else if(a==='edit'){const d=DATA.find(x=>x.id===b.dataset.i);if(d){st.edit=d.id;st.msg='กำลังแก้ไขข้อมูลของ '+d.name;render();scrollTo(0,0)}}
 else if(a==='del'){const _d=DATA.find(x=>String(x.id)===b.dataset.i);if(confirm('ลบข้อมูลของ '+(_d?_d.name:'รายการนี้')+' ?')){dbDel(b.dataset.i).then(()=>{if(db)DATA=DATA.filter(d=>d.id!==b.dataset.i);render()}).catch(e=>alert(fbErr(e)))}}
 else if(a==='clear'){if(confirm('ล้างข้อมูลผู้ตอบทั้งหมด?')){dbClear().then(()=>{if(db)DATA=[];render()}).catch(e=>alert(fbErr(e)))}}
};

const toArr=(v,n)=>{const a=String(v||'').split(',').map(x=>Math.max(0,parseInt(x,10)||0));while(a.length<n)a.push(0);return a.slice(0,n)};

function applyEdit(u){
 const e=EDITS[u.cd],b=u.base;
 if(!e){u.G=[...b.G];u.F=[...b.F];u.O=[...b.O];u.C=[...b.C];u.gt=b.gt;u.fc=b.fc;u.fo=b.fo;u.ct=b.ct;u.note=b.note;u.ed=null}
 else{u.G=toArr(e.G,b.G.length);u.F=toArr(e.F,b.F.length);u.O=toArr(e.O,b.O.length);u.C=toArr(e.C,b.C.length);
  u.gt=Math.max(0,b.gt+sm(u.G)-sm(b.G));u.fc=Math.max(0,b.fc+sm(u.F)-sm(b.F));u.fo=Math.max(0,b.fo+sm(u.O)-sm(b.O));u.ct=Math.max(0,b.ct+sm(u.C)-sm(b.C));
  u.note=e.note!=null?String(e.note).trim():b.note;u.ed={by:e.by||'',at:e.at||''}}
 u.ft=u.fc+u.fo;u.all=u.gt+u.ft+u.ct;u.inf=u.gt+u.fc;u.dif=u.fr-u.inf;
}

/* ===== หน้าภาพรวมและข้อมูลเชิงลึก: วิเคราะห์จากข้อมูลหน้าข้อมูลอัตรากำลัง (D) ===== */
const pc0=(a,b)=>b?Math.round(a/b*100):0;
const nm=u=>u.n.replace(/^รพ\.?สต\./,'');
const lst=(a,k=4)=>a.slice(0,k).map(u=>esc(nm(u))).join(', ')+(a.length>k?' และอีก '+(a.length-k)+' แห่ง':'');
function ana(){
 D.forEach(u=>{u.dr=u.G[0]+u.G[1]+u.G[2];u.rn=u.G[1]+u.G[3]+u.F[0]+u.F[1]+u.C[0];u.pt=u.G[7]+u.F[8]+u.F[9]+u.C[2];u.dn=u.G[5]+u.G[6]+u.F[4]+u.F[5]+u.F[6]+u.F[7];
  u.rk=/รักษาการ|รก\./.test(u.note);u.rt=/เกษียณ/.test(u.note);u.mv=/ย้าย|ลาออก/.test(u.note);u.hp=/ช่วยราชการ|มาช่วย/.test(u.note);
  const t=[];if(!u.dr)t.push(['ไม่มี ผอ.',1]);if(!u.rn)t.push(['ไม่มีพยาบาล',1]);else if(u.rn===1)t.push(['พยาบาล 1 คน',0]);if(!u.pt)t.push(['ไม่มีแพทย์แผนไทย',0]);if(u.gt<=2)t.push(['ข้าราชการ ≤ 2 คน',1]);if(u.rt&&u.dr)t.push(['ผอ.เกษียณ',1]);if(u.dif>=7)t.push(['ขาด '+u.dif+' อัตรา',1]);
  u.tg=t;u.sc=(u.dr?0:3)+(u.rn?(u.rn===1?1.5:0):4)+(u.pt?0:1)+(u.gt<=2?2:0)+(u.rt&&u.dr?2:0)+u.dif*.5});
 const gt=S(D,'gt'),ft=S(D,'ft'),ct=S(D,'ct'),al=gt+ft+ct,fr=S(D,'fr'),inf=S(D,'inf');
 const g=j=>cs('G',j),F=j=>cs('F',j),C=j=>cs('C',j),O=S(D,'fo');
 const job=[['พยาบาลวิชาชีพ',g(1)+g(3),F(0)+F(1)+C(0)],['นักวิชาการสาธารณสุข',g(0)+g(4),F(2)+F(3)+C(1)],['เจ้าพนักงานสาธารณสุข',g(2)+g(8),0],['แพทย์แผนไทย',g(7),F(8)+F(9)+C(2)],['ทันตสาธารณสุข',g(5)+g(6),F(4)+F(5)+F(6)+F(7)],['การเงิน / ธุรการ',g(9),F(10)+F(11)+C(4)+C(5)],['สายสนับสนุน (ผู้ช่วย ขับรถ บริการ ทำความสะอาด ฯลฯ)',0,O+C(3)+C(6)+C(7)+C(8)+C(9)+C(10)]].map(r=>[r[0],r[1]+r[2],'ข้าราชการ '+f(r[1])+' · พนักงานจ้าง '+f(r[2])]);
 const am=amphoeRows().map(r=>({...r,p:pc0(r.inf,r.fr),gap:r.fr-r.inf})).sort((a,b)=>a.p-b.p);
 const sz=['L','M','S'].map(s=>{const d=D.filter(u=>u.s===s);return[{L:'ขนาดใหญ่ (L)',M:'ขนาดกลาง (M)',S:'ขนาดเล็ก (S)'}[s]+' · '+d.length+' แห่ง',pc0(S(d,'inf'),S(d,'fr')),'']});
 const nod=D.filter(u=>!u.dr),nodk=nod.filter(u=>u.rk),nodn=nod.filter(u=>!u.rk);
 const rn0=D.filter(u=>!u.rn),rn1=D.filter(u=>u.rn===1),pt0=D.filter(u=>!u.pt),dn0=D.filter(u=>!u.dn),g2=D.filter(u=>u.gt<=2);
 const rt=D.filter(u=>u.rt),rt1=rt.filter(u=>u.dr),mv=D.filter(u=>u.mv),hp=D.filter(u=>u.hp);
 const pri=[...D].sort((a,b)=>b.sc-a.sc).slice(0,10);
 return{gt,ft,ct,al,fr,inf,gap:fr-inf,p:pc0(inf,fr),job,am,sz,nod,nodk,nodn,rn0,rn1,pt0,dn0,g2,rt,rt1,mv,hp,pri,sh:pc0(ft+ct,al)};
}

function sha256(m){
 const rr=(x,n)=>x>>>n|x<<32-n,K=[],H=[];
 for(let p=2,c=0;c<64;p++){let ok=1;for(let d=2;d*d<=p;d++)if(p%d===0){ok=0;break}
  if(ok){if(c<8)H[c]=(Math.pow(p,.5)*4294967296)|0;K[c++]=(Math.pow(p,1/3)*4294967296)|0}}
 const b=new TextEncoder().encode(m),l=b.length,n=((l+8)>>6)+1,w=new Uint32Array(n*16);
 for(let i=0;i<l;i++)w[i>>2]|=b[i]<<(24-(i&3)*8);
 w[l>>2]|=0x80<<(24-(l&3)*8);w[n*16-1]=l*8;
 const h=H.slice();
 for(let j=0;j<n*16;j+=16){
  const W=[];
  for(let i=0;i<64;i++){
   if(i<16)W[i]=w[j+i];
   else{const s0=W[i-15],s1=W[i-2];W[i]=(W[i-16]+(rr(s0,7)^rr(s0,18)^s0>>>3)+W[i-7]+(rr(s1,17)^rr(s1,19)^s1>>>10))|0}}
  let [a,b2,c2,d,e,f2,g,hh]=h;
  for(let i=0;i<64;i++){
   const t1=(hh+(rr(e,6)^rr(e,11)^rr(e,25))+((e&f2)^(~e&g))+K[i]+W[i])|0;
   const t2=((rr(a,2)^rr(a,13)^rr(a,22))+((a&b2)^(a&c2)^(b2&c2)))|0;
   hh=g;g=f2;f2=e;e=(d+t1)|0;d=c2;c2=b2;b2=a;a=(t1+t2)|0}
  [a,b2,c2,d,e,f2,g,hh].forEach((v,i)=>{h[i]=(h[i]+v)|0})}
 return h.map(v=>(v>>>0).toString(16).padStart(8,'0')).join('')
}

const lg=$('#lg');
lg.onclick=e=>{if(e.target===lg||e.target.closest('[data-x]'))lg.close()};
function dlg(html,fn){
 $('#lgc').innerHTML=html;lg.showModal();
 const f=$('#lgc form');f.elements[0].focus();
 f.onsubmit=e=>{e.preventDefault();const err=fn(Object.fromEntries(new FormData(f)));if(err)$('#lge').textContent=err;else lg.close()};
}
const FM='<form class="form" style="grid-template-columns:1fr">',
 BT=t=>`<div class="actions"><button class="btn" type="submit">${t}</button><button class="btn sec" type="button" data-x>ยกเลิก</button><span class="err" id="lge" role="alert"></span></div></form>`;
function setUser(u){
 st.user=u?u.u:null;st.role=u?u.role:'guest';
 try{u?sessionStorage.setItem(SK,u.u):sessionStorage.removeItem(SK)}catch(e){}
 $('#who').textContent=u?u.name+' · '+ROLES[u.role]:ROLES.guest;
 $('#lgb').textContent=u?'ออกจากระบบ':'เข้าสู่ระบบ';$('#pwb').hidden=!u;go('dash');
}
$('#lgb').onclick=()=>{
 if(st.user){setUser(null);return}
 dlg(`<h2>เข้าสู่ระบบ</h2>${FM}<label>ชื่อผู้ใช้<input name="u" autocomplete="username"></label><label>รหัสผ่าน<input name="p" type="password" autocomplete="current-password"></label>${BT('เข้าสู่ระบบ')}<p class="note">ไม่ลงชื่อเข้าใช้ = บุคคลทั่วไป ดู Dashboard ได้อย่างเดียว</p>`,d=>{
  const u=USERS.find(x=>x.u===(d.u||'').trim().toLowerCase());
  if(!u||hpw(d.p||'',u.salt)!==u.h)return 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง';
  setUser(u)});
};
$('#pwb').onclick=()=>dlg(`<h2>เปลี่ยนรหัสผ่าน</h2>${FM}<label>รหัสผ่านเดิม<input name="o" type="password" autocomplete="current-password"></label><label>รหัสผ่านใหม่ (อย่างน้อย 6 ตัวอักษร)<input name="n" type="password" autocomplete="new-password"></label><label>ยืนยันรหัสผ่านใหม่<input name="c" type="password" autocomplete="new-password"></label>${BT('บันทึก')}`,d=>{
 const u=USERS.find(x=>x.u===st.user);
 if(!u||hpw(d.o||'',u.salt)!==u.h)return 'รหัสผ่านเดิมไม่ถูกต้อง';
 if((d.n||'').length<6)return 'รหัสผ่านใหม่ต้องมีอย่างน้อย 6 ตัวอักษร';

 ${st.msg?`<div class="insight" role="status">${esc(st.msg)}</div>`:''}
 <div class="glass card"><h2>เพิ่มผู้ใช้</h2><div class="form"><label>ชื่อผู้ใช้ (อังกฤษ/ตัวเลข)<input id="nu" autocomplete="off"></label><label>ชื่อ-สกุล<input id="nn"></label><label>สิทธิ์<select id="nr">${ro.map(r=>`<option value="${r}">${ROLES[r]}</option>`).join('')}</select></label><label>รหัสผ่าน (อย่างน้อย 6 ตัวอักษร)<input id="np" autocomplete="off"></label><div class="actions full"><button class="btn" data-act="u_add">เพิ่มผู้ใช้</button></div></div></div>
 <div class="glass card"><h2>ผู้ใช้ทั้งหมด (${USERS.length})</h2><div class="tw"><table><thead><tr><th>ชื่อผู้ใช้</th><th>ชื่อ-สกุล</th><th>สิทธิ์</th><th></th></tr></thead><tbody>${USERS.map(x=>`<tr><td>${esc(x.u)}</td><td>${esc(x.name)}</td><td>${x.u===st.user?esc(ROLES[x.role]):sel(x.role,`data-ur="${esc(x.u)}"`)}</td><td><button class="btn sec sm" data-act="u_pw" data-i="${esc(x.u)}">รีเซ็ตรหัสผ่าน</button>${x.u===st.user?'':` <button class="btn sec sm" data-act="u_del" data-i="${esc(x.u)}">ลบ</button>`}</td></tr>`).join('')}</tbody></table></div></div>`;
}

  render();
 }else if(a==='u_pw'){
  const x=USERS.find(y=>y.u===b.dataset.i),p=x&&prompt('รหัสผ่านใหม่ของ '+x.u+' (อย่างน้อย 6 ตัวอักษร)');
  if(p){if(p.length<6){alert('รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร');return}x.salt=newSalt();x.h=hpw(p,x.salt);saveU();st.msg='รีเซ็ตรหัสผ่านของ '+x.u+' เรียบร้อยแล้ว';render()}
 }else if(a==='u_del'){
  const x=USERS.find(y=>y.u===b.dataset.i);if(!x)return;
  if(x.role==='admin'&&nAdmin()<2){alert('ลบไม่ได้: ต้องมีผู้ดูแลระบบอย่างน้อย 1 คน');return}
  if(confirm('ลบผู้ใช้ '+x.u+'?')){USERS=USERS.filter(y=>y!==x);saveU();render()}
 }
}
$('#view').onchange=e=>{
 const s=e.target.closest('[data-ur]');if(!s||st.role!=='admin')return;
 const x=USERS.find(y=>y.u===s.dataset.ur);if(!x)return;
 if(x.role==='admin'&&s.value!=='admin'&&nAdmin()<2){alert('ต้องมีผู้ดูแลระบบอย่างน้อย 1 คน');render();return}
 x.role=s.value;saveU();st.msg='ปรับสิทธิ์ของ '+x.u+' เป็น '+ROLES[x.role]+' แล้ว';render();
};

$('#theme').onclick=()=>{const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=dark?'light':'dark'};
addEventListener('resize',renderNav);

/* Chatbot (ตัวอย่าง: ของจริงเรียก /api/ai/chat แบบ RAG จากระเบียบที่อัปโหลด) */
$('#botbtn').onclick=()=>{const b=$('#botbox');b.hidden=!b.hidden;if(!b.hidden)$('#bi').focus()};
$('#bi').onkeydown=e=>{
 if(e.key!=='Enter'||!e.target.value.trim())return;
 const q=e.target.value.trim();e.target.value='';
 const add=(t,u)=>{const d=document.createElement('div');d.className='m'+(u?' u':'');d.textContent=t;$('#log').append(d);$('#log').scrollTop=1e9};
 add(q,1);
 const topic=['เลื่อนขั้น','ลา','CNEU','CMU','PA'].find(k=>q.toUpperCase().includes(k.toUpperCase()));
 add(topic?`ระบบจะค้นข้อความที่เกี่ยวกับ "${topic}" จากเอกสารระเบียบที่ผู้ดูแลอัปโหลด แล้วตอบพร้อมอ้างอิงข้อและหน้า (ต้นแบบนี้ยังไม่ได้เชื่อมเอกสารจริง)`:'ต้นแบบนี้ยังไม่เชื่อมเอกสารระเบียบ ลองถามเรื่อง เลื่อนขั้น การลา ชั่วโมงอบรม หรือการประเมินผลงาน');
};

document.documentElement.dataset.theme=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
setUser((()=>{try{return USERS.find(x=>x.u===sessionStorage.getItem(SK))||null}catch(e){return null}})());

/* มือถือ: ใส่ป้ายชื่อคอลัมน์ให้ตารางข้อมูลสำรวจ เพื่อแสดงเป็นการ์ดรายคน */
(function(){const run=()=>{const t=document.querySelector('#dtbl table');if(!t||!t.tHead)return;const h=[...t.tHead.rows[0].cells].map(x=>x.textContent.trim().replace(/\s*\(เลือกได้.*$/,''));[...t.tBodies[0].rows].forEach(r=>{if(r.cells.length<2)return;[...r.cells].forEach((c,i)=>{c.dataset.label=h[i]||''})})};let q;new MutationObserver(()=>{clearTimeout(q);q=setTimeout(run,0)}).observe(document.getElementById('view'),{childList:true,subtree:true});run()})();
</script>
