function bindSurvey(){
 const f=$('#f');
 const g=k=>f.elements[k].value.trim();
 const setUnits=a=>{const u=f.elements.unit,list=(U.find(x=>x[0]===a)||[,[]])[1];u.disabled=!a;u.innerHTML=a?'<option value="">เลือก รพ.สต.</option>'+op(list)+'<option value="__x">อื่น ๆ (ไม่อยู่ในรายการ)</option>':'<option value="">เลือกอำเภอก่อน</option>';f.elements.unitx.hidden=true};
 const unitName=()=>g('unit')==='__x'?g('unitx'):g('unit');
 /* คนเดิม = รพ.สต.เดียวกัน และเลขที่ตำแหน่งหรือชื่อ-สกุลตรงกัน */
 const find=()=>{const u=unitName(),p=g('posno'),n=g('name');if(!u)return null;return DATA.find(d=>d.id!==st.edit&&d.unit===u&&((p&&d.posno===p)||(n&&d.name===n)))};
 const goEdit=d=>{st.edit=d.id;st.msg='พบข้อมูลเดิมของ '+d.name+' ระบบดึงข้อมูลเดิมมาให้แล้ว กรุณาตรวจสอบและแก้ไข แล้วกด "บันทึกการแก้ไข"';render();scrollTo(0,0)};
 const chk=()=>{const d=find();if(d)goEdit(d)};
 f.elements.amphoe.onchange=()=>setUnits(f.elements.amphoe.value);
 f.elements.unit.onchange=()=>{const x=f.elements.unitx;x.hidden=f.elements.unit.value!=='__x';if(!x.hidden)x.focus();else chk()};
 f.elements.posno.onchange=chk;f.elements.name.onchange=chk;f.elements.unitx.onchange=chk;
 f.onsubmit=e=>{
  e.preventDefault();
  const courses=[...f.querySelectorAll('input[name=c]:checked')].map(x=>x.value);
  const miss=[['unitN','ชื่อ รพ.สต.'],['amphoe','อำเภอ'],['name','ชื่อ-สกุล'],['posno','เลขที่ตำแหน่ง'],['pos','ตำแหน่ง'],['level','ระดับ'],['grp','กลุ่มงาน']].filter(x=>x[0]==='unitN'?!unitName():!g(x[0])).map(x=>x[1]);
  const err=$('#err');
  if(miss.length){err.textContent='กรุณากรอก: '+miss.join(', ');return}
  if(!courses.length){err.textContent='กรุณาเลือกอย่างน้อย 1 หลักสูตร';return}
  const dup=find();
  if(dup&&!st.edit){goEdit(dup);return}
  if(dup){err.textContent='มีข้อมูลของ '+dup.name+' อยู่แล้ว กรุณาตรวจสอบเลขที่ตำแหน่งหรือชื่อ-สกุล';return}
  const rec={id:st.edit||Date.now()+Math.random().toString(36).slice(2,6),unit:unitName(),amphoe:g('amphoe'),name:g('name'),posno:g('posno'),pos:g('pos'),level:g('level'),grp:g('grp'),courses,at:new Date().toISOString()};
  const i=DATA.findIndex(d=>d.id===rec.id),was=!!st.edit;
  if(i>=0)DATA[i]=rec;else DATA.push(rec);
  st.edit=null;save();st.msg=(was?'แก้ไขข้อมูลของ ':'บันทึกแบบสำรวจของ ')+rec.name+' เรียบร้อยแล้ว';render();scrollTo(0,0);
 };
 /* โหมดแก้ไข: ใส่ข้อมูลเดิมลงฟอร์ม */
 const cur=st.edit&&DATA.find(d=>d.id===st.edit);
 if(cur){
  f.elements.amphoe.value=cur.amphoe;setUnits(cur.amphoe);
  if((U.find(x=>x[0]===cur.amphoe)||[,[]])[1].includes(cur.unit))f.elements.unit.value=cur.unit;
  else{f.elements.unit.value='__x';f.elements.unitx.hidden=false;f.elements.unitx.value=cur.unit}
  ['name','posno','pos','level','grp'].forEach(k=>f.elements[k].value=cur[k]||'');
  f.querySelectorAll('input[name=c]').forEach(x=>x.checked=cur.courses.includes(x.value));
 }else st.edit=null;
}

 if(a==='unit')openUnit(+b.dataset.i);

 else if(a==='dx')dirXlsx();
 else if(a==='xlsx')xlsx();
 else if(a==='demo')demo();
 else if(a==='cancel'){st.edit=null;st.msg='';render()}
 else if(a==='edit'){const d=DATA.find(x=>x.id===b.dataset.i);if(d){st.edit=d.id;st.msg='กำลังแก้ไขข้อมูลของ '+d.name;render();scrollTo(0,0)}}
 else if(a==='del'){if(confirm('ลบรายการนี้?')){DATA=DATA.filter(d=>d.id!==b.dataset.i);save();render()}}

};

  const t=[];if(!u.dr)t.push(['ไม่มี ผอ.',1]);if(!u.rn)t.push(['ไม่มีพยาบาล',1]);else if(u.rn===1)t.push(['พยาบาล 1 คน',0]);if(!u.pt)t.push(['ไม่มีแพทย์แผนไทย',0]);if(u.gt<=2)t.push(['ข้าราชการ ≤ 2 คน',1]);if(u.rt&&u.dr)t.push(['ผอ.เกษียณ',1]);if(u.dif>=7)t.push(['ขาด '+u.dif+' อัตรา',1]);

 const ins=(c,t,body,act)=>`<div class="insight ${c}"><b>${t}</b><br>${body}${act?`<span class="act">▶ ควรทำ: ${act}</span>`:''}</div>`;
 const tb=a.pri.map((u,i)=>[`<tr data-act="unit" data-i="${u.i}"><td>${i+1}</td><td>${esc(u.n)}</td><td>${esc(u.a)}</td><td class="n">${pc0(u.inf,u.fr)}%</td><td class="n">${u.dif}</td><td class="n">${u.dr?'มี':'<b style="color:var(--bad)">ไม่มี</b>'}</td><td class="n">${u.rn}</td><td>${u.tg.map(t=>`<span class="tag${t[1]?' r':''}">${t[0]}</span>`).join('')}</td></tr>`]).join('');
 return `<div class="glass hero"><h1>ภาพรวมกำลังพล</h1><p class="sub">ขอบเขตข้อมูล: ${SCOPE[st.role]} · วิเคราะห์จากหน้าทำเนียบกำลังพล ข้อมูล ณ วันที่ ${AS_OF}</p><div class="hchips"><span>${D.length} รพ.สต.</span><span>${AM.length} อำเภอ</span><span>${f(a.al)} คน</span></div></div>
 <div class="kpis"><div class="glass kpi"><b>${f(a.al)}</b><span>บุคลากรปฏิบัติงานจริง (คน)</span></div><div class="glass kpi"><b>${a.p}%</b><span>ครองกรอบอัตรากำลัง · ขาด ${f(a.gap)} อัตรา</span></div><div class="glass kpi"><b>${a.nod.length}</b><span>รพ.สต. ที่ไม่มี ผอ.</span></div><div class="glass kpi"><b>${a.rn0.length}</b><span>รพ.สต. ที่ไม่มีพยาบาลวิชาชีพ</span></div></div>
 <div class="glass card"><h2>สรุปสำหรับผู้บริหาร</h2><p style="margin:0 0 6px;font-weight:500">ขณะนี้มีบุคลากร ${f(a.al)} คน ใน ${D.length} รพ.สต. ครองกรอบอัตรากำลังได้ ${a.p}% (ขาด ${f(a.gap)} อัตรา) โดยเกินครึ่ง (${a.sh}%) เป็นพนักงานจ้าง ประเด็นที่ควรตัดสินใจก่อน:</p><ol class="notes"><li><b>ตำแหน่ง ผอ.รพ.สต. ว่าง ${a.nod.length} แห่ง</b> — ${a.nodk.length} แห่งมีผู้รักษาการ อีก ${a.nodn.length} แห่งยังไม่ระบุ</li><li><b>พยาบาลวิชาชีพ</b> ไม่มีเลย ${a.rn0.length} แห่ง และมีคนเดียว ${a.rn1.length} แห่ง เสี่ยงหยุดให้บริการเมื่อมีลา/ย้าย</li><li><b>อำเภอที่ขาดมากที่สุด</b> คือ ${low.map(r=>esc(r.a)+' ('+r.p+'%)').join(', ')}</li></ol></div>
 <div class="cols"><div class="glass card"><h2>กำลังพลแยกตามสายงาน</h2>${bars(a.job)}${a.job.reduce((x,y)=>x+y[1],0)!==a.al?`<p class="note">ผลบวกรายตำแหน่ง ${f(a.job.reduce((x,y)=>x+y[1],0))} คน ต่างจากยอดรวม ${f(a.al)} คน ตามข้อมูลต้นทาง (ดูหน้าทำเนียบ)</p>`:''}<h3>ครองกรอบตามขนาด รพ.สต.</h3>${bars(a.sz.map(r=>[r[0],r[1],'']))}<p class="note">ตัวเลขเป็นร้อยละของกรอบอัตรากำลัง</p><h3>ครองกรอบรายอำเภอ (ต่ำ → สูง)</h3>${a.am.map(r=>`<div class="bar"><span>${esc(r.a)}<small>ขาด ${r.gap} อัตรา</small></span><div class="track"><div class="fill" style="width:${r.p}%"></div></div><b>${r.p}%</b></div>`).join('')}</div>
 <div class="glass card"><h2>ข้อมูลเชิงลึกและข้อเสนอแนะ</h2>
 ${ins('bad','อัตรากำลังขาด '+f(a.gap)+' อัตรา ('+(100-a.p)+'% ของกรอบ)',D.filter(u=>u.dif>0).length+' จาก '+D.length+' แห่งยังไม่ครบกรอบ · อำเภอที่ครองกรอบต่ำสุด: '+low.map(r=>esc(r.a)+' ขาด '+r.gap).join(', '),'ใช้ลำดับอำเภอนี้เป็นฐานเสนอขอบรรจุ/จ้างเพิ่ม')}
 ${ins('bad','ตำแหน่ง ผอ.รพ.สต. ว่าง '+a.nod.length+' แห่ง ('+pc0(a.nod.length,D.length)+'%)',a.nodk.length+' แห่งมี รก.ผอ. ตามหมายเหตุ'+(a.nodn.length?' · ยังไม่ระบุผู้รักษาการ: '+lst(a.nodn,5):'')+(a.rt1.length?'<br>ผอ.เกษียณ 30 ก.ย. 69 ที่ยังนับอยู่ในข้อมูล '+a.rt1.length+' แห่ง: '+lst(a.rt1):''),'แต่งตั้งผู้รักษาการให้ครบ และวางแผนสรรหา/เลื่อน ผอ. ล่วงหน้า')}
 ${ins('bad','พยาบาลวิชาชีพไม่พอ','ไม่มีเลย '+a.rn0.length+' แห่ง'+(a.rn0.length?' ('+lst(a.rn0)+')':'')+' · มี 1 คน '+a.rn1.length+' แห่ง ('+pc0(a.rn1.length,D.length)+'%)','จัดพยาบาลหมุนเวียนระดับอำเภอ และจัดลำดับการบรรจุให้แห่งที่ไม่มีก่อน')}
 ${ins('','แพทย์แผนไทยและทันตสาธารณสุขไม่ครบทุกแห่ง','ไม่มีแพทย์แผนไทย '+a.pt0.length+' แห่ง ('+pc0(a.pt0.length,D.length)+'%) · ไม่มีบุคลากรทันตสาธารณสุข '+a.dn0.length+' แห่ง ('+pc0(a.dn0.length,D.length)+'%)','ตั้งทีมเคลื่อนที่/หมุนเวียนระดับอำเภอ แทนการจัดครบทุกแห่ง')}
 ${ins('','พึ่งพาพนักงานจ้างสูง','พนักงานจ้างเงินบำรุง + จ้างเหมา รวม '+f(a.ft+a.ct)+' คน ('+a.sh+'%) มากกว่าข้าราชการ '+f(a.gt)+' คน · มีข้าราชการไม่เกิน 2 คน '+a.g2.length+' แห่ง','ประเมินงบเงินบำรุงรองรับค่าจ้างต่อเนื่อง และเร่งสรรหาข้าราชการให้แห่งที่มีน้อย')}
 ${ins('','ความเคลื่อนไหวตามหมายเหตุ','เกษียณ '+a.rt.length+' · ย้าย/ลาออก '+a.mv.length+' · ช่วยราชการ '+a.hp.length+' แห่ง','ปรับข้อมูลกำลังพลหลังวันที่ 1 ต.ค. 69 ให้ตรงจริง')}
 ${surveyInsight()}
 <p class="note">วิเคราะห์ด้วยกฎคำนวณจากข้อมูลจริงในระบบ (ยังไม่ได้เชื่อมบริการ <code>/api/ai/insights</code>)</p></div></div>
 <div class="glass card"><h2>รพ.สต. ที่ควรเร่งดูแลก่อน 10 แห่ง</h2><p class="note" style="margin:0 0 10px">จัดอันดับจากปัจจัยเสี่ยง: ไม่มี ผอ., ไม่มีพยาบาล, ข้าราชการน้อย, ผอ.ใกล้เกษียณ และจำนวนอัตราที่ขาด · คลิกแถวเพื่อดูรายละเอียด</p><div class="tw"><table><thead><tr>${['ที่','รพ.สต.','อำเภอ','ครองกรอบ','ขาด (อัตรา)','ผอ.','พยาบาล','ปัจจัยเสี่ยง'].map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${tb}</tbody></table></div><div class="actions"><button class="btn" data-act="go" data-i="dir">ดูทำเนียบกำลังพลทั้งหมด</button></div></div>`;
}
function dashUnit(u,a){
 const A=D.filter(x=>x.a===u.a),ap=pc0(S(A,'inf'),S(A,'fr')),up=pc0(u.inf,u.fr);
 const ins=(c,t,b)=>`<div class="insight ${c}"><b>${t}</b><br>${b}</div>`;
 return `<div class="glass hero"><h1>ภาพรวมกำลังพล</h1><p class="sub">${esc(u.n)} · อำเภอ${esc(u.a)} · ขนาด ${u.s} · ข้อมูล ณ วันที่ ${AS_OF}</p><div class="hchips"><span>ตัวอย่างหน่วย: ${esc(nm(u))}</span></div></div>
 <div class="kpis"><div class="glass kpi"><b>${u.all}</b><span>บุคลากรปฏิบัติงานจริง (คน)</span></div><div class="glass kpi"><b>${up}%</b><span>ครองกรอบ (${u.inf}/${u.fr})</span></div><div class="glass kpi"><b>${u.gt}</b><span>ข้าราชการ</span></div><div class="glass kpi"><b>${u.ft+u.ct}</b><span>พนักงานจ้าง</span></div></div>
 <div class="cols"><div class="glass card"><h2>เทียบกับค่าเฉลี่ย</h2>${bars([['รพ.สต. ของท่าน',up,''],['อำเภอ'+u.a,ap,''],['ทั้งกอง',a.p,'']])}<p class="note">ร้อยละการครองกรอบอัตรากำลัง</p></div>
 <div class="glass card"><h2>ข้อมูลเชิงลึก</h2>${ins(u.dif>0?'bad':'','อัตรากำลัง',u.dif>0?'ขาด '+u.dif+' อัตรา จากกรอบ '+u.fr:'ครบตามกรอบ')}${ins(u.dr?'':'bad','ผอ.รพ.สต.',u.dr?'มีผู้ดำรงตำแหน่ง':'ยังไม่มีผู้ดำรงตำแหน่ง'+(u.rk?' (มีผู้รักษาการ)':''))}${ins(u.rn>1?'':'bad','พยาบาลวิชาชีพ',u.rn?u.rn+' คน':'ไม่มี')}${u.note?ins('','หมายเหตุ',esc(u.note)):''}</div></div>
 <div class="glass card">${unitDetail(u.i)}</div>`;
}

/* Global search */
const pal=$('#pal');
function openPal(){pal.showModal();$('#q').value='';fill('');$('#q').focus()}
function fill(q){
 const items=MENUS.filter(m=>CAN[st.role].includes(m.id)&&(m.t+m.s).toLowerCase().includes(q.toLowerCase()));
 $('#res').innerHTML=items.length?items.map(m=>`<button data-p="${m.id}">${m.i} ${esc(m.t)}</button>`).join(''):'<div class="empty">ไม่พบรายการ ลองคำอื่น</div>';
}
$('#sbtn').onclick=openPal;
$('#q').oninput=e=>fill(e.target.value);
$('#res').onclick=e=>{const b=e.target.closest('[data-p]');if(b){pal.close();go(b.dataset.p)}};
pal.onclick=e=>{if(e.target===pal)pal.close()};
addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();pal.open?pal.close():openPal()}});

/* Nav, role, theme */
$('#nav').onclick=e=>{const b=e.target.closest('[data-go]');if(b)go(b.dataset.go)};
$('#role').onchange=e=>{st.role=e.target.value;go(st.view)};
$('#theme').onclick=()=>{const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=dark?'light':'dark'};
addEventListener('resize',renderNav);

/* Chatbot (ตัวอย่าง: ของจริงเรียก /api/ai/chat แบบ RAG จากระเบียบที่อัปโหลด) */
$('#botbtn').onclick=()=>{const b=$('#botbox');b.hidden=!b.hidden;if(!b.hidden)$('#bi').focus()};
$('#bi').onkeydown=e=>{
 if(e.key!=='Enter'||!e.target.value.trim())return;
 const q=e.target.value.trim();e.target.value='';
 const add=(t,u)=>{const d=document.createElement('div');d.className='m'+(u?' u':'');d.textContent=t;$('#log').append(d);$('#log').scrollTop=1e9};
 add(q,1);
 const topic=['เลื่อนขั้น','ลา','CNEU','CMU','PA'].find(k=>q.toUpperCase().includes(k.toUpperCase()));
 add(topic?`ระบบจะค้นข้อความที่เกี่ยวกับ "${topic}" จากเอกสารระเบียบที่ผู้ดูแลอัปโหลด แล้วตอบพร้อมอ้างอิงข้อและหน้า (ต้นแบบนี้ยังไม่ได้เชื่อมเอกสารจริง)`:'ต้นแบบนี้ยังไม่เชื่อมเอกสารระเบียบ ลองถามเรื่อง เลื่อนขั้น การลา ชั่วโมงอบรม หรือการประเมินผลงาน');
};

document.documentElement.dataset.theme=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
go('dash');
</script>
</body>
</html>
